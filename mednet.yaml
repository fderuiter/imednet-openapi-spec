  /studies/{studyKey}/records:
    get:
      summary: List records (eCRF instances) in a study
      description: Retrieve a paged and filtered list of all record instances (eCRFs) for a specific study.
      operationId: listRecords
      tags:
      - Records
      security:
      - apiKeyAuth: []
        securityKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/StudyKeyPath'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      - $ref: '#/components/parameters/SortParam'
      - $ref: '#/components/parameters/FilterParam'
      - $ref: '#/components/parameters/RecordDataFilterParam'
      responses:
        '200':
          description: Successful response with list of records
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/Metadata'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Record'
                title: listRecords_200_response
              examples:
                recordsList:
                  $ref: '#/components/examples/ExampleRecordsList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Add new record or update subject/record data
      description: Submit a job to perform an asynchronous bulk insert or update of subject record data. Use the 'GET /jobs/{batchId}' endpoint to check the status of the submitted job.
      operationId: createRecords
      tags:
      - Records
      security:
      - apiKeyAuth: []
        securityKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/StudyKeyPath'
      requestBody:
        description: An array of record objects defining the operation to perform
          (subject registration, record creation, or scheduled record update).
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCreateRequest'
            examples:
              registerSubject:
                $ref: '#/components/examples/ExampleRegisterSubjectRequest'
              updateRecord:
                $ref: '#/components/examples/ExampleUpdateScheduledRecordRequest'
              newRecord:
                $ref: '#/components/examples/ExampleCreateNewRecordRequest'
      responses:
        '202':
          description: Accepted request for record creation. Returns a job identifier
            to check status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordJobStatus'
                title: createRecords_202_response
              examples:
                recordPostAccepted:
                  $ref: '#/components/examples/ExamplePostRecordResponse'
          links:
            checkJobStatus:
              $ref: '#/components/links/CheckJobStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /studies/{studyKey}/jobs/{batchId}:
    get:
      summary: Retrieve job status by batch ID
      description: Retrieve the current status of an asynchronous job previously submitted via the POST /records endpoint.
      operationId: getJobStatus
      tags:
      - Jobs
      security:
      - apiKeyAuth: []
        securityKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/StudyKeyPath'
      - $ref: '#/components/parameters/BatchIdPath'
      responses:
        '200':
          description: Successful response with job status information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
                title: getJobStatus_200_response
              examples:
                jobStatus:
                  $ref: '#/components/examples/ExampleJobStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Metadata:
      type: object
      properties:
        status:
          type: string
          description: HTTP status of the response (e.g., OK or ERROR)
        method:
          type: string
          description: HTTP method of the request
        path:
          type: string
          description: Requested URI path
        timestamp:
          type: string
          description: Timestamp when response was generated
        error:
          type: object
          description: Error details if an error occurred.
          properties:
            code:
              type: string
              description: A specific error code identifying the issue.
            description:
              type: string
              description: A human-readable description of the error.
            field:
              type: object
              description: Details about the specific field that caused a validation
                error.
              properties:
                attribute:
                  type: string
                  description: The name of the request attribute that caused the error.
                value:
                  type: string
                  description: The invalid value that was provided for the attribute.
          additionalProperties: true
      title: Metadata
    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          description: Current index page returned
        size:
          type: integer
          description: Number of items per page returned
        totalPages:
          type: integer
          description: Total number of pages available
        totalElements:
          type: integer
          description: Total number of elements (items) available
        sort:
          type: array
          items:
            $ref: '#/components/schemas/Sort'
      title: Pagination
    Sort:
      type: object
      properties:
        property:
          type: string
          description: Name of the property by which the result is sorted
        direction:
          type: string
          description: Sort direction (ASC or DESC)
      title: Sort
    Study:
      type: object
      properties:
        sponsorKey:
          type: string
          description: Sponsor key that this study is belong to
        studyKey:
          type: string
          description: Unique study key
        studyId:
          type: integer
          description: Mednet study ID
        studyName:
          type: string
          description: Study name
        studyDescription:
          type: string
          description: Study description detail
        studyType:
          type: string
          description: The type of study
        dateCreated:
          type: string
          description: Date when this record was created
        dateModified:
          type: string
          description: Last date modified of this record
      title: Study
    Site:
      type: object
      properties:
        studyKey:
          type: string
          description: Unique study key for a given study
        siteId:
          type: integer
          description: Unique site Id
        siteName:
          type: string
          description: Site name
        siteEnrollmentStatus:
          type: string
          description: Status of site enrollment
        dateCreated:
          type: string
          description: Date when this record was created
        dateModified:
          type: string
          description: Last date modified of this record
      title: Site
    Form:
      type: object
      properties:
        studyKey:
          type: string
          description: Unique study key
        formId:
          type: integer
          description: Mednet Form ID
        formKey:
          type: string
          description: Form key
        formName:
          type: string
          description: Name of the eCRF
        formType:
          type: string
          description: 'eCRF Type. For example: Subject/Site'
        revision:
          type: integer
          description: Number of modifications of the form metadata
        embeddedLog:
          type: boolean
          description: Embedded Log checkbox value on the form attributes
        enforceOwnership:
          type: boolean
          description: Enforce Ownership checkbox value on the form attributes
        userAgreement:
          type: boolean
          description: User Agreement checkbox value on the form attributes
        subjectRecordReport:
          type: boolean
          description: Subject Record Report checkbox value on the form attributes
        unscheduledVisit:
          type: boolean
          description: Include in Unscheduled Visits checkbox value on the form attributes
        otherForms:
          type: boolean
          description: Include in Other Forms checkbox value on the form attributes
        eproForm:
          type: boolean
          description: Is ePRO checkbox value on the form attributes
        allowCopy:
          type: boolean
          description: Allow Copy checkbox value on the form attributes
        disabled:
          type: boolean
          description: Form is soft delete status
        dateCreated:
          type: string
          description: Date when this form was created
        dateModified:
          type: string
