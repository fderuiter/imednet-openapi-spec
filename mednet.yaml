  /studies/{studyKey}/recordRevisions:
    get:
      summary: List record revisions (audit trail entries) in a study
      description: Retrieve a paged and filtered list of all record revisions for a specific study. Each record revision represents a distinct state (revision) in the lifecycle of a record, providing a complete audit trail.
      operationId: listRecordRevisions
      tags:
      - Record Revisions
      security:
      - apiKeyAuth: []
        securityKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/StudyKeyPath'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      - $ref: '#/components/parameters/SortParam'
      - $ref: '#/components/parameters/FilterParam'
      responses:
        '200':
          description: Successful response with list of record revisions
          content:
            application/json:
              schema:
                type: object
