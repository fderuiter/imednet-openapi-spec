  parameters:
    StudyKeyPath:
      name: studyKey
      in: path
      required: true
      description: Study key identifying the study context for the request
      schema:
        type: string
    BatchIdPath:
      name: batchId
      in: path
      required: true
      description: Batch ID of the job to retrieve
      schema:
        type: string
    PageParam:
      name: page
      in: query
      description: Page index to retrieve (0-based)
      schema:
        type: integer
        default: 0
    SizeParam:
      name: size
      in: query
      description: Number of items to return per page (max 500)
      schema:
        type: integer
        default: 25
    SortParam:
      name: sort
      in: query
      description: Sorting criteria in the format `property,ASC` or `property,DESC`.
        Can be repeated.
      schema:
        type: string
    FilterParam:
      name: filter
      in: query
      description: 'Optional filter criteria to apply. Supports operators (`<`, `<=`, `>`, `>=`, `==`, `!=`) and can combine multiple criteria with `;` (AND) or `,` (OR).'
      schema:
        type: string
    RecordDataFilterParam:
      name: recordDataFilter
      in: query
      description: 'Optional filter criteria to apply on recordData fields (question
        responses). Supports operators (`<`, `<=`, `>`, `>=`, `==`, `!=`, `=~` for contains) and can combine multiple
        criteria with `;` (AND) or `,` (OR).'
      schema:
        type: string
    IncludeInactiveParam:
      name: includeInactive
      in: query
      description: For user listing, whether to include inactive users
      schema:
        type: boolean
        default: false
    XEmailNotifyHeader:
      name: x-email-notify
      in: header
      description: Email address to send notification once job is complete (optional)
      schema:
        type: string
  responses:
    BadRequest:
      description: 'Bad Request. The server cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, invalid request message framing, or deceptive request routing). This corresponds to error code `1000`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Metadata'
          example:
            metadata:
              status: BAD_REQUEST
              path: "/api/v1/edc/studies"
              timestamp: "2018-10-18 05:46:29"
              error:
                code: "1000"
                description: "Field raised validation errors"
                field:
                  attribute: "page"
                  value: "XX"
    Unauthorized:
      description: 'Unauthorized. The client must authenticate itself to get the requested response. This corresponds to error code `9001`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Metadata'
          example:
            metadata:
              status: ERROR
              error:
                code: "9001"
                description: "Unauthorized error. Insufficient permission to retrieve data."
    Forbidden:
      description: Authenticated but not allowed to access the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Metadata'
          example:
            metadata:
              status: ERROR
              error:
                message: Access is forbidden for the provided credentials.
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Metadata'
          example:
            metadata:
              status: ERROR
              error:
                message: The requested resource could not be found.
    TooManyRequests:
      description: Too many requests (rate limit exceeded)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Metadata'
          example:
            metadata:
              status: ERROR
              error:
                message: Too many requests - rate limit exceeded, please try again
                  later or contact support.
    InternalServerError:
      description: 'Internal server error (unexpected condition encountered). This corresponds to error code `9000`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Metadata'
          example:
            metadata:
              status: ERROR
              error:
                code: "9000"
                description: "Unknown error. Please contact Mednet support for assistance."
