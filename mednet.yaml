openapi: 3.1.0
info:
  title: Mednet EDC API
  description: 'The Mednet EDC (Electronic Data Capture) REST API provides a single-point
    of access for reading data stored across iMednet data services.

    This specification documents all available endpoints in the latest version of
    the API.

    '
  version: 1.0.14
  contact:
    name: Mednet
    url: https://www.mednetsolutions.com/contact/
    email: support@mednetsolutions.com
servers:
- url: https://edc.prod.imednetapi.com/api/v1/edc
  description: Production EDC API server
tags:
- name: Studies
  description: Endpoints for managing studies.
- name: Sites
  description: Endpoints for managing sites within a study.
- name: Forms
  description: Endpoints for managing forms (eCRFs) in a study.
- name: Intervals
  description: Endpoints for managing intervals (visit definitions).
- name: Visits
  description: Endpoints for managing visits (subject visit instances).
- name: Subjects
  description: Endpoints for managing subjects in a study.
- name: Users
  description: Endpoints for managing users and their roles.
- name: Variables
  description: Endpoints for managing variables (fields) on forms.
- name: Codings
  description: Endpoints for managing coding activities.
- name: Queries
  description: Endpoints for managing data queries.
- name: Record Revisions
  description: Endpoints for retrieving record revisions (audit trail).
- name: Records
  description: Endpoints for managing subject records (eCRF data).
- name: Jobs
  description: Endpoints for checking the status of asynchronous jobs.
paths:
  /studies:
    get:
      summary: List studies accessible by API key
      description: Retrieve a paged and filtered list of all studies accessible by the provided API key.
      operationId: listStudies
      tags:
      - Studies
      security:
      - apiKeyAuth: []
        securityKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      - $ref: '#/components/parameters/SortParam'
      - $ref: '#/components/parameters/FilterParam'
      responses:
        '200':
          description: Successful response with list of studies
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/Metadata'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Study'
                title: listStudies_200_response
              examples:
                studiesList:
                  $ref: '#/components/examples/ExampleStudiesList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /studies/{studyKey}/sites:
