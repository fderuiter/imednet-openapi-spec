  parameters:
    StudyKey:
      name: studyKey
      in: path
      required: true
      description: The unique key for a given study.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: Which index page to be returned.
      schema:
        type: integer
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Items per page to be returned. Maximum is 500.
      schema:
        type: integer
        default: 25
        maximum: 500
    Sort:
      name: sort
      in: query
      required: false
      description: >
        Name of the property by which to sort the result set.
        To sort in a particular direction add a comma to the property name and either 'asc' or 'desc'.
        Example 'formId,asc'.
      schema:
        type: string
    Filter:
      name: filter
      in: query
      required: false
      description: >
        Optional filter search criteria. Refer to the Common API documentation for syntax details.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request was malformed. The response body will include an error providing further information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: The request was rejected related to security issue. The response body will include an error providing further information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: The request was rejected related to security issue, likely an invalid studyKey. The response body will include an error providing further information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: The request was rejected related to invalid resource issue. The response body will include an error providing further information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Your iMednet-supplied API key.
    imnSecurityKey:
      type: apiKey
      in: header
      name: x-imn-security-key
      description: Your iMednet-supplied security key.
