openapi: 3.1.0
info:
  title: iMednet API
  version: 1.0.0
  description: >
    Comprehensive OpenAPI 3.1 specification for the iMednet API.
    This specification is generated based on the official iMednet API documentation
    and serves as the single source of truth for the API's contract.
  contact:
    name: Mednet
    url: https://www.mednetsolutions.com/
servers:
  - url: https://edc.prod.imednetapi.com
    description: Production EDC API Server
security:
  - apiKey: []
    imnSecurityKey: []
tags:
  - name: Studies
    description: Endpoints related to studies.
  - name: Sites
    description: Endpoints related to sites.
  - name: Users
    description: Endpoints related to users.
  - name: Subjects
    description: Endpoints related to subjects.
  - name: Forms
    description: Endpoints related to forms.
  - name: Intervals
    description: Endpoints related to intervals.
  - name: Visits
    description: Endpoints related to visits.
  - name: Variables
    description: Endpoints related to variables.
  - name: Queries
    description: Endpoints related to queries.
  - name: Record Revisions
    description: Endpoints related to record revisions.
  - name: Records
    description: Endpoints related to records.
  - name: Jobs
    description: Endpoints related to jobs.
  - name: Codings
    description: Endpoints related to codings.
paths:
  /api/v1/edc/studies:
    get:
      tags:
        - Studies
      summary: Get a list of studies
      description: Fetches the set of studies the API key is authorized to view.
      operationId: getStudies
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A paginated list of studies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/edc/studies/{studyKey}/sites:
    get:
      tags:
        - Sites
      summary: Get a list of sites for a study
      description: Given a StudyKey, fetch the set of sites.
      operationId: getSitesByStudy
      parameters:
        - $ref: '#/components/parameters/StudyKey'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A paginated list of sites.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSiteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/edc/studies/{studyKey}/users:
    get:
      tags:
        - Users
      summary: Get a list of users for a study
      description: Given a StudyKey, fetch the users.
      operationId: getUsersByStudy
      parameters:
        - $ref: '#/components/parameters/StudyKey'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: includeInactive
          in: query
          required: false
          description: Boolean flag whether to include inactive Users.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A paginated list of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/edc/studies/{studyKey}/subjects:
    get:
      tags:
        - Subjects
      summary: Get a list of subjects for a study
      description: Given a StudyKey, fetch the set of subjects.
      operationId: getSubjectsByStudy
      parameters:
        - $ref: '#/components/parameters/StudyKey'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A paginated list of subjects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/edc/studies/{studyKey}/forms:
    get:
      tags:
        - Forms
      summary: Get a list of forms for a study
      description: Given a StudyKey, fetch the set of forms.
      operationId: getFormsByStudy
      parameters:
        - $ref: '#/components/parameters/StudyKey'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A paginated list of forms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFormResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/edc/studies/{studyKey}/intervals:
    get:
      tags:
        - Intervals
      summary: Get a list of intervals for a study
      description: Given a StudyKey, fetch the set of intervals.
      operationId: getIntervalsByStudy
      parameters:
        - $ref: '#/components/parameters/StudyKey'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A paginated list of intervals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIntervalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/edc/studies/{studyKey}/visits:
    get:
      tags:
        - Visits
      summary: Get a list of visits for a study
      description: Given a StudyKey, fetch the set of visits.
      operationId: getVisitsByStudy
      parameters:
        - $ref: '#/components/parameters/StudyKey'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A paginated list of visits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVisitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/edc/studies/{studyKey}/variables:
    get:
      tags:
        - Variables
      summary: Get a list of variables for a study
      description: Given a StudyKey, fetch the set of variables.
      operationId: getVariablesByStudy
      parameters:
        - $ref: '#/components/parameters/StudyKey'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A paginated list of variables.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVariableResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/edc/studies/{studyKey}/queries:
    get:
      tags:
        - Queries
      summary: Get a list of queries for a study
      description: Given a StudyKey, fetch the set of queries.
      operationId: getQueriesByStudy
      parameters:
        - $ref: '#/components/parameters/StudyKey'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A paginated list of queries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/edc/studies/{studyKey}/recordRevisions:
    get:
      tags:
        - Record Revisions
      summary: Get a list of record revisions for a study
      description: Given a StudyKey, fetch the set of record revisions.
      operationId: getRecordRevisionsByStudy
      parameters:
        - $ref: '#/components/parameters/StudyKey'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A paginated list of record revisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecordRevisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/edc/studies/{studyKey}/records:
    get:
      tags:
        - Records
      summary: Get a list of records for a study
      description: Given a StudyKey, fetch the set of records.
      operationId: getRecordsByStudy
      parameters:
        - $ref: '#/components/parameters/StudyKey'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filter'
        - name: recordDataFilter
          in: query
          required: false
          description: Optional filter for record data. Refer to Common documentation for syntax.
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Records
      summary: Create or update records
      description: >
        Adds or updates records in the iMednet database. The request body determines the action
        (register a subject, update a scheduled record, or create a new record).
      operationId: postRecords
      parameters:
        - $ref: '#/components/parameters/StudyKey'
        - name: x-email-notify
          in: header
          required: false
          description: Email address to notify upon job completion.
          schema:
            type: string
            format: email
      requestBody:
        description: An array of record creation or update objects.
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RecordCreationRequestItem'
      responses:
        '200':
          description: The job was successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/edc/studies/{studyKey}/jobs/{batchId}:
    get:
      tags:
        - Jobs
      summary: Get job status
      description: Given a batch ID, fetch the job information.
      operationId: getJobStatus
      parameters:
        - $ref: '#/components/parameters/StudyKey'
        - name: batchId
          in: path
          required: true
          description: The batch ID provided from the POST records endpoint.
          schema:
            type: string
      responses:
        '200':
          description: The job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/edc/studies/{studyKey}/codings:
    get:
      tags:
        - Codings
      summary: Get a list of codings for a study
      description: Given a StudyKey, fetch the coding activity.
      operationId: getCodingsByStudy
      parameters:
        - $ref: '#/components/parameters/StudyKey'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: A paginated list of codings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCodingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  schemas:
    Metadata:
      type: object
      properties:
        status:
          type: string
          description: Http status.
          example: OK
        method:
          type: string
          description: Http method.
          example: GET
        path:
          type: string
          description: Requested URI path.
        timestamp:
          type: string
          description: Timestamp when response was generated.
        error:
          type: object
          description: Contains error details if an error occurred.
    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          description: Current index page.
        size:
          type: integer
          description: Size per page.
        totalPages:
          type: integer
          description: Total pages return from search.
        totalElements:
          type: integer
          description: Total elements return from search.
        sort:
          type: array
          items:
            type: object
            properties:
              property:
                type: string
                description: Sort property.
              direction:
                type: string
                description: Sort direction.
    ErrorField:
      type: object
      properties:
        attribute:
          type: string
          description: Origination request attribute which caused the error.
        value:
          type: string
          description: The value of request attribute passed in the request.
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          description: Error code.
        description:
          type: string
          description: Error description message.
        field:
          $ref: '#/components/schemas/ErrorField'
    ApiError:
      type: object
      properties:
        metadata:
          type: object
          properties:
            status:
              type: string
            path:
              type: string
            timestamp:
              type: string
            error:
              $ref: '#/components/schemas/ErrorDetail'
    Study:
      type: object
      properties:
        sponsorKey:
          type: string
          description: Sponsor key that this study belongs to.
        studyKey:
          type: string
          description: Unique study key.
        studyId:
          type: integer
          description: Mednet study ID.
        studyName:
          type: string
          description: Study name.
        studyDescription:
          type: string
          description: Study description detail.
        studyType:
          type: string
          description: The type of study.
        dateCreated:
          type: string
          description: Date when this study was created.
        dateModified:
          type: string
          description: Last date modified of this study.
    PaginatedStudyResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        pagination:
          $ref: '#/components/schemas/Pagination'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Study'
    Site:
      type: object
      properties:
        studyKey:
          type: string
          description: Unique study key for a given study.
        siteId:
          type: integer
          description: Unique site Id.
        siteName:
          type: string
          description: Site name.
        siteEnrollmentStatus:
          type: string
          description: Status of site enrollment.
        dateCreated:
          type: string
          description: Date when this site was created.
        dateModified:
          type: string
          description: Last date modified of this site.
    PaginatedSiteResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        pagination:
          $ref: '#/components/schemas/Pagination'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Site'
    Role:
      type: object
      properties:
        dateCreated:
          type: array
          items:
            type: number
          description: Role date created.
        dateModified:
          type: array
          items:
            type: number
          description: Role date modified.
        roleId:
          type: string
          description: Role ID.
        communityId:
          type: integer
          description: Community ID associated with Role.
        name:
          type: string
          description: Role name.
        description:
          type: string
          description: Role description.
        level:
          type: integer
          description: Role level.
        type:
          type: string
          description: Role type.
        inactive:
          type: boolean
          description: Inactive.
    User:
      type: object
      properties:
        userId:
          type: string
          description: User ID.
        login:
          type: string
          description: Login.
        firstName:
          type: string
          description: First name.
        lastName:
          type: string
          description: Last name.
        email:
          type: string
          description: Email.
        userActiveInStudy:
          type: boolean
          description: Boolean value for if the user is active in the study.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    PaginatedUserResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        pagination:
          $ref: '#/components/schemas/Pagination'
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
    Keyword:
      type: object
      properties:
        keywordName:
          type: string
        keywordKey:
          type: string
        keywordId:
          type: integer
        dateAdded:
          type: string
    Subject:
      type: object
      properties:
        studyKey:
          type: string
          description: Unique study key for a given study.
        subjectId:
          type: integer
          description: Mednet Subject ID.
        subjectOid:
          type: string
          description: Client-assigned subject OID.
        subjectKey:
          type: string
          description: Protocol-assigned subject identifier.
        subjectStatus:
          type: string
          description: Subject status.
        siteId:
          type: integer
          description: Mednet Site ID.
        siteName:
          type: string
          description: Site name.
        enrollmentStartDate:
          type: string
          description: Enrollment start date.
        deleted:
          type: boolean
          description: Subject deleted flag.
        dateCreated:
          type: string
          description: Date when this subject was created.
        dateModified:
          type: string
          description: Last date modified of this subject.
        keywords:
          type: array
          items:
            $ref: '#/components/schemas/Keyword'
    PaginatedSubjectResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        pagination:
          $ref: '#/components/schemas/Pagination'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Subject'
    Form:
      type: object
      properties:
        studyKey:
          type: string
          description: Unique study key for a given study.
        formId:
          type: integer
          description: Mednet Form ID.
        formKey:
          type: string
          description: Form key.
        formName:
          type: string
          description: Name of the eCRF.
        formType:
          type: string
          description: eCRF Type. For example Subject/Site.
        revision:
          type: integer
          description: Number of modifications of the form metadata.
        embeddedLog:
          type: boolean
        enforceOwnership:
          type: boolean
        userAgreement:
          type: boolean
        subjectRecordReport:
          type: boolean
        unscheduledVisit:
          type: boolean
        otherForms:
          type: boolean
        eproForm:
          type: boolean
        allowCopy:
          type: boolean
        disabled:
          type: boolean
          description: Form is soft delete status.
        dateCreated:
          type: string
        dateModified:
          type: string
    PaginatedFormResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        pagination:
          $ref: '#/components/schemas/Pagination'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Form'
    IntervalForm:
      type: object
      properties:
        formId:
          type: integer
          description: Form ID.
        formKey:
          type: string
          description: Form Key.
        formName:
          type: string
          description: Form name.
    Interval:
      type: object
      properties:
        studyKey:
          type: string
        intervalId:
          type: integer
        intervalName:
          type: string
        intervalDescription:
          type: string
        intervalSequence:
          type: integer
        intervalGroupId:
          type: integer
        intervalGroupName:
          type: string
        disabled:
          type: boolean
        dateCreated:
          type: string
        dateModified:
          type: string
        timeline:
          type: string
        definedUsingInterval:
          type: string
        windowCalculationForm:
          type: string
        windowCalculationDate:
          type: string
        actualDateForm:
          type: string
        actualDate:
          type: string
        dueDateWillBeIn:
          type: integer
        negativeSlack:
          type: integer
        positiveSlack:
          type: integer
        eproGracePeriod:
          type: integer
        forms:
          type: array
          items:
            $ref: '#/components/schemas/IntervalForm'
    PaginatedIntervalResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        pagination:
          $ref: '#/components/schemas/Pagination'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Interval'
    Visit:
      type: object
      properties:
        visitId:
          type: integer
        studyKey:
          type: string
        intervalId:
          type: integer
        intervalName:
          type: string
        subjectId:
          type: integer
        subjectKey:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        dueDate:
          type: string
          nullable: true
        visitDate:
          type: string
        visitDateForm:
          type: string
        deleted:
          type: boolean
        visitDateQuestion:
          type: string
        dateCreated:
          type: string
        dateModified:
          type: string
    PaginatedVisitResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        pagination:
          $ref: '#/components/schemas/Pagination'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Visit'
    Variable:
      type: object
      properties:
        studyKey:
          type: string
        variableId:
          type: integer
        variableType:
          type: string
        variableName:
          type: string
        sequence:
          type: integer
        revision:
          type: integer
        disabled:
          type: boolean
        dateCreated:
          type: string
        dateModified:
          type: string
        formId:
          type: integer
        variableOid:
          type: string
        deleted:
          type: boolean
        formKey:
          type: string
        formName:
          type: string
        label:
          type: string
        blinded:
          type: boolean
    PaginatedVariableResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        pagination:
          $ref: '#/components/schemas/Pagination'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Variable'
    QueryComment:
      type: object
      properties:
        sequence:
          type: integer
        annotationStatus:
          type: string
        user:
          type: string
        comment:
          type: string
        closed:
          type: boolean
        date:
          type: string
    Query:
      type: object
      properties:
        studyKey:
          type: string
        subjectId:
          type: integer
        subjectOid:
          type: string
        annotationType:
          type: string
        annotationId:
          type: integer
        type:
          type: string
          nullable: true
        description:
          type: string
        recordId:
          type: integer
        variable:
          type: string
        subjectKey:
